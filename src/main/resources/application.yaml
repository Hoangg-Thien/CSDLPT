spring:
  application:
    name: ride-app
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    primary:
      jdbc-url: jdbc:postgresql://localhost:5432/rideapp
      username: user
      password: password
      driver-class-name: org.postgresql.Driver
    replica:
      jdbc-url: jdbc:postgresql://localhost:5433/rideapp
      username: user
      password: password
      driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:5174
  regions:
    south:
      primary-url: jdbc:postgresql://localhost:5436/rideapp?options=-c%20TimeZone=Asia/Ho_Chi_Minh
      replica-url: jdbc:postgresql://localhost:5437/rideapp?options=-c%20TimeZone=Asia/Ho_Chi_Minh
      username: admin
      password: secret
    north:
      primary-url: jdbc:postgresql://localhost:5438/rideapp?options=-c%20TimeZone=Asia/Ho_Chi_Minh
      replica-url: jdbc:postgresql://localhost:5439/rideapp?options=-c%20TimeZone=Asia/Ho_Chi_Minh
      username: admin
      password: secret
  failover:
    timeout-ms: 3000

server:
  port: 8080
